*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}

.ed text{fill:var(--mute);font-size:11px;opacity:0;transition:opacity .2s}.ed.hot text,.ed.imp text{opacity:1}

.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){.ed.flow path,.nd.cur .pulse{animation:none}}

var gB=el('g',{},svg),gE=el('g',{},svg),gN=el('g',{},svg);
layers.forEach(function(l,i){var y=TOP+i*BAND-30;var g=el('g',{'class':'band'},gB);el('rect',{x:8,y:y,width:VW-16,height:BAND-8,rx:12},g);
var t=el('text',{x:20,y:y+20},g);t.textContent=(i+1)+'. '+l.name+(l.note?' · '+l.note:'');
var row=nodes.filter(function(n){return n.layer===l.id;});var tot=row.length*W+(row.length-1)*GX;var x0=(VW-tot)/2;
row.forEach(function(n,j){pos[n.id]={x:x0+j*(W+GX),y:TOP+i*BAND+4};});});
var edgeEls=[];
var layerOf={};nodes.forEach(function(n){layerOf[n.id]=layers.map(function(l){return l.id;}).indexOf(n.layer);});
function gutter(la,lb,ax,bx){var lo=Math.min(la,lb)+1,hi=Math.max(la,lb)-1,minx=Infinity,maxx=-Infinity;
nodes.forEach(function(n){var li=layerOf[n.id];if(li>=lo&&li<=hi&&pos[n.id]){minx=Math.min(minx,pos[n.id].x);maxx=Math.max(maxx,pos[n.id].x+W);}});
if(minx===Infinity)return null;var mid=(ax+bx)/2+W/2;var L=minx-28,R=maxx+28;return Math.abs(mid-L)<=Math.abs(R-mid)?Math.max(20,L):Math.min(VW-20,R);}
edges.forEach(function(e,i){var a=pos[e.from],b=pos[e.to];if(!a||!b)return;var d,lx,ly;
var la=layerOf[e.from],lb=layerOf[e.to];
if(la===lb){var sx=a.x+W/2,tx=b.x+W/2,sy=a.y,top=sy-34-Math.min(30,Math.abs(tx-sx)/8);d='M'+sx+' '+sy+' C'+sx+' '+top+' '+tx+' '+top+' '+tx+' '+sy;lx=(sx+tx)/2;ly=top+4;}
else{var down=lb>la;var sx2=a.x+W/2,sy2=down?a.y+H:a.y,tx2=b.x+W/2,ty2=down?b.y:b.y+H;var gx=Math.abs(la-lb)>1?gutter(la,lb,a.x,b.x):null;
if(gx!==null){var k=down?1:-1;d='M'+sx2+' '+sy2+' C'+sx2+' '+(sy2+k*44)+' '+gx+' '+(sy2+k*20)+' '+gx+' '+(sy2+k*70)+' L'+gx+' '+(ty2-k*70)+' C'+gx+' '+(ty2-k*20)+' '+tx2+' '+(ty2-k*44)+' '+tx2+' '+ty2;lx=gx+(gx<VW/2?-4:4);ly=(sy2+ty2)/2;}
else{var my=(sy2+ty2)/2;d='M'+sx2+' '+sy2+' C'+sx2+' '+my+' '+tx2+' '+my+' '+tx2+' '+ty2;lx=(sx2+tx2)/2+6;ly=my;}}
var g=el('g',{'class':'ed '+e.kind},gE);var p=el('path',{d:d,'marker-end':'url(#ar)'},g);var anchor=(lx<VW/2&&Math.abs(la-lb)>1)?'end':(Math.abs(la-lb)>1?'start':'middle');var t=el('text',{x:lx,y:ly,'text-anchor':anchor},g);t.textContent=e.label||KIND[e.kind];
edgeEls.push({e:e,g:g,p:p});});
var nodeEls={};
nodes.forEach(function(n){var q=pos[n.id];if(!q)return;var g=el('g',{'class':'nd',tabindex:'0',role:'button','aria-label':n.title,transform:'translate('+q.x+' '+q.y+')'},gN);
el('rect',{'class':'pulse',x:-4,y:-4,width:W+8,height:H+8,rx:14,style:'transform-origin:'+(W/2)+'px '+(H/2)+'px'},g);
el('rect',{'class':'box',width:W,height:H,rx:12},g);
var t=el('text',{'class':'t',x:14,y:27},g);t.textContent=n.title.length>22?n.title.slice(0,21)+'…':n.title;
var p=el('text',{'class':'p',x:14,y:47},g);p.textContent=n.path.length>27?n.path.slice(0,26)+'…':n.path;
var dotc={cao:'var(--hi)','vừa':'var(--mid)','thấp':'var(--lo)'}[n.risk];el('circle',{cx:W-14,cy:16,r:5,fill:dotc},g);
if(n.exposure==='public'){var gl=el('text',{x:W-28,y:20,'text-anchor':'middle','class':'dot',fill:'var(--hi)'},g);gl.textContent='⌁';}
g.addEventListener('click',function(){onNode(n.id);});g.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();onNode(n.id);}});
nodeEls[n.id]=g;});
var mode='structure',sel=null;
function clear(){Object.keys(nodeEls).forEach(function(k){nodeEls[k].setAttribute('class','nd');});edgeEls.forEach(function(x){x.g.setAttribute('class','ed '+x.e.kind+(mode==='structure'&&!RM?' flow':''));});}
function setCls(id,c){var g=nodeEls[id];if(g)g.setAttribute('class',g.getAttribute('class')+' '+c);}
function list(xs){xs=xs||[];return xs.length?'<ul>'+xs.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'<p style="margin:0;color:var(--mute)">—</p>';}
function names(ids){return ids.map(function(id){return '<span class="link" data-go="'+esc(id)+'">'+esc(byId[id].title)+'</span>';}).join(', ')||'<span style="color:var(--mute)">không có</span>';}
function promptFor(n){var hit=impact(n.id).map(function(x){var o=byId[x.id];return o.title+' ('+o.path+')';});
var mit=(n.threats||[]).map(function(t){return t.mitigation;});
return 'Dự án '+M.project.name+'. Phần cần làm: '+n.title+' ('+n.path+').\nVai trò hiện tại: '+n.role+'\n'+
'Hợp đồng không được đổi: '+((n.contracts||[]).join('; ')||'không có')+'\n'+
'Sửa phần này có thể ảnh hưởng: '+(hit.join('; ')||'không có khối nào gọi tới')+'\n'+
'Rủi ro: '+n.risk+(mit.length?'. Bảo mật phải giữ: '+mit.join('; '):'')+'\n'+
'Yêu cầu: <anh ghi vấn đề hoặc thay đổi muốn làm ở đây>\n'+
'Đọc docs/ARCHITECTURE.md trước. Chỉ sửa trong '+n.path+' trừ khi thật cần, và nói rõ nếu phải đụng khối khác.';}
function nodePanel(n){var out=edges.filter(function(e){return e.from===n.id;}),inn=edges.filter(function(e){return e.to===n.id;}),hit=impact(n.id);
var h='<h2>'+esc(n.title)+'</h2><div class="path">'+esc(n.path)+'</div><p style="margin:8px 0">'+esc(n.role)+'</p>'+
'<span class="badge b-'+esc(n.risk)+'">Rủi ro '+esc(n.risk)+'</span><span class="badge b-'+esc(n.exposure)+'">'+esc(EXPO[n.exposure])+'</span>';
h+='<h3>PHỤ THUỘC VÀO</h3><p style="margin:0">'+names(out.map(function(e){return e.to;}))+'</p>';
h+='<h3>ĐƯỢC DÙNG BỞI</h3><p style="margin:0">'+names(inn.map(function(e){return e.from;}))+'</p>';
h+='<h3>SỬA KHỐI NÀY ẢNH HƯỞNG TỚI</h3><p style="margin:0">'+names(hit.map(function(x){return x.id;}))+'</p>';
if((n.owns||[]).length)h+='<h3>DỮ LIỆU SỞ HỮU</h3>'+list(n.owns);
h+='<h3>QUYỀN</h3>'+list(n.permissions)+'<h3>GIỚI HẠN</h3>'+list(n.limits);
if((n.contracts||[]).length)h+='<h3>HỢP ĐỒNG (KHÔNG TỰ ĐỔI)</h3>'+list(n.contracts);
h+='<h3>BẢO MẬT</h3>'+((n.threats||[]).length?(n.threats||[]).map(function(t){return '<div class="thr"><b>'+esc(t.threat)+'</b>'+(t.impact?'<br>Hậu quả: '+esc(t.impact):'')+'<br>Chặn bằng: '+esc(t.mitigation)+'</div>';}).join(''):'<p style="margin:0;color:var(--mute)">Chưa ghi mối đe doạ nào.</p>');
if((n.learn||[]).length)h+='<h3>KHÁI NIỆM CẦN HỌC</h3>'+n.learn.map(function(l){return '<div class="learn"><b>'+esc(l.term)+'</b><br>'+esc(l.explain)+'</div>';}).join('');
if(n.aiTip)h+='<h3>KHI GIAO AI SỬA PHẦN NÀY</h3><p style="margin:0">'+esc(n.aiTip)+'</p>';
var ev=out.concat(inn).filter(function(e){return e.evidence;});
if(ev.length)h+='<h3>BẰNG CHỨNG TRONG CODE</h3>'+list(ev.map(function(e){return byId[e.from].title+' → '+byId[e.to].title+': '+e.evidence;}));
h+='<h3>PROMPT MẪU</h3><textarea id="pr">'+esc(promptFor(n))+'</textarea><button id="cp" style="margin-top:6px">Chép prompt</button>';
return h;}
function bindPanel(){panel.querySelectorAll('[data-go]').forEach(function(a){a.addEventListener('click',function(){onNode(a.getAttribute('data-go'));});});
var cp=document.getElementById('cp');if(cp)cp.addEventListener('click',function(){var t=document.getElementById('pr');
var done=function(){cp.textContent='Đã chép';setTimeout(function(){cp.textContent='Chép prompt';},1500);};
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(done,function(){t.select();document.execCommand('copy');done();});else{t.select();document.execCommand('copy');done();}});}
function intro(){var h='';
if(mode==='structure')h='<h2>Bấm vào một khối</h2><p>Mỗi khối là một phần của dự án. Mũi tên A → B nghĩa là A gọi hoặc dùng B. Bấm khối để xem nó làm gì, quyền, giới hạn, bảo mật, bài học và prompt mẫu.</p>';
if(mode==='impact')h='<h2>Sửa khối nào?</h2><p>Bấm một khối: các khối <b style="color:var(--hi)">đỏ</b> gọi trực tiếp tới nó, <b style="color:var(--mid)">vàng</b> bị ảnh hưởng gián tiếp. Đây là những chỗ cần test lại khi sửa.</p>';
if(mode==='security'){var all=[];nodes.forEach(function(n){(n.threats||[]).forEach(function(t){all.push({n:n,t:t});});});
var rank={'cao':0,'vừa':1,'thấp':2};all.sort(function(a,b){return rank[a.n.risk]-rank[b.n.risk];});
h='<h2>Bảo mật</h2><div class="legend"><span><i style="background:var(--hibg);border:1px solid var(--hi)"></i>rủi ro cao</span><span><i style="background:var(--midbg);border:1px solid var(--mid)"></i>vừa</span><span><i style="background:var(--lobg);border:1px solid var(--lo)"></i>thấp</span><span style="color:var(--hi)">⌁ lộ ra Internet</span></div>'+
'<h3>CÁC MỐI ĐE DOẠ, CAO TRƯỚC</h3>'+(all.length?all.map(function(x){return '<div class="thr"><span class="link" data-go="'+esc(x.n.id)+'">'+esc(x.n.title)+'</span>: <b>'+esc(x.t.threat)+'</b>'+(x.t.impact?'<br>Hậu quả: '+esc(x.t.impact):'')+'<br>Chặn bằng: '+esc(x.t.mitigation)+'</div>';}).join(''):'<p>Chưa ghi mối đe doạ nào.</p>');}
panel.innerHTML=h;bindPanel();}
function onNode(id){var n=byId[id];if(!n)return;if(mode==='flow')setMode('structure');sel=id;clear();
if(mode==='structure'){var nb={};nb[id]=1;edgeEls.forEach(function(x){var on=x.e.from===id||x.e.to===id;x.g.setAttribute('class','ed '+x.e.kind+(on?' hot':' dim')+(on&&!RM?' flow':''));if(on){nb[x.e.from]=1;nb[x.e.to]=1;}});
nodes.forEach(function(o){if(!nb[o.id])setCls(o.id,'dim');});setCls(id,'sel');}
if(mode==='impact'){var hit=impact(id),hs={};hs[id]=1;hit.forEach(function(x){hs[x.id]=1;setCls(x.id,x.depth===1?'imp1':'imp2');});
nodes.forEach(function(o){if(!hs[o.id])setCls(o.id,'dim');});setCls(id,'sel');
edgeEls.forEach(function(x){var on=hs[x.e.from]&&hs[x.e.to];x.g.setAttribute('class','ed '+x.e.kind+(on?' imp':' dim'));});}
if(mode==='security'){paintSecurity();setCls(id,'sel');}
panel.innerHTML=nodePanel(n);bindPanel();}
function paintSecurity(){clear();nodes.forEach(function(n){setCls(n.id,'r-'+n.risk);});}
var fIdx=0,step=0,timer=null,runner=null;
var fs=document.getElementById('flowSel');flows.forEach(function(f,i){var o=document.createElement('option');o.value=i;o.textContent=f.name;fs.appendChild(o);});
if(!flows.length)document.querySelector('[data-mode=flow]').classList.add('hidden');
fs.addEventListener('change',function(){fIdx=+fs.value;step=0;stop();showStep();});
function stop(){if(timer){clearTimeout(timer);timer=null;}document.getElementById('play').textContent='▶ Chạy';}
function showStep(){var f=flows[fIdx];if(!f)return;var s=f.steps[step];clear();
nodes.forEach(function(n){setCls(n.id,'dim');});
var g=nodeEls[s.node];if(g)g.setAttribute('class','nd cur');
var prev=step>0?f.steps[step-1].node:null;
edgeEls.forEach(function(x){var on=prev&&((x.e.from===prev&&x.e.to===s.node)||(x.e.to===prev&&x.e.from===s.node));x.g.setAttribute('class','ed '+x.e.kind+(on?' hot'+(RM?'':' flow'):' dim'));if(on&&!RM)run(x,x.e.from===prev);});
panel.innerHTML='<h2>'+esc(f.name)+'</h2><p style="color:var(--mute);margin:0 0 8px">Bước '+(step+1)+'/'+f.steps.length+'</p><p style="font-size:16px;margin:0 0 10px">'+esc(s.text)+'</p>'+
'<h3>KHỐI ĐANG CHẠY</h3><p style="margin:0"><span class="link" data-go="'+esc(s.node)+'">'+esc(byId[s.node].title)+'</span> · <span class="path">'+esc(byId[s.node].path)+'</span></p>'+
'<h3>CÁC BƯỚC</h3><ol style="margin:0;padding-left:18px">'+f.steps.map(function(x,i){return '<li style="'+(i===step?'font-weight:600':'color:var(--mute)')+'">'+esc(x.text)+'</li>';}).join('')+'</ol>';bindPanel();}
function run(x,forward){if(runner)runner.remove();var L=x.p.getTotalLength(),t0=null;runner=el('circle',{id:'runner',r:6},gE);
function f(ts){if(!runner)return;if(t0===null)t0=ts;var k=Math.min(1,(ts-t0)/900);var pt=x.p.getPointAtLength(forward?k*L:(1-k)*L);runner.setAttribute('cx',pt.x);runner.setAttribute('cy',pt.y);if(k<1)requestAnimationFrame(f);}
requestAnimationFrame(f);}
document.getElementById('next').addEventListener('click',function(){stop();var f=flows[fIdx];step=(step+1)%f.steps.length;showStep();});
document.getElementById('prev').addEventListener('click',function(){stop();var f=flows[fIdx];step=(step-1+f.steps.length)%f.steps.length;showStep();});
document.getElementById('play').addEventListener('click',function(){if(timer){stop();return;}var b=this;b.textContent='❚❚ Dừng';
(function tick(){showStep();var f=flows[fIdx];if(step>=f.steps.length-1){timer=setTimeout(function(){stop();},1800);return;}timer=setTimeout(function(){step++;tick();},1900);})();});
function setMode(m){mode=m;stop();if(runner){runner.remove();runner=null;}
document.querySelectorAll('[data-mode]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-mode')===m);});
document.getElementById('flowCtl').classList.toggle('hidden',m!=='flow');clear();
if(m==='security')paintSecurity();if(m==='flow'){step=0;showStep();return;}
if(sel&&m!=='security')onNode(sel);else intro();}
document.querySelectorAll('[data-mode]').forEach(function(b){b.addEventListener('click',function(){setMode(b.getAttribute('data-mode'));});});
document.getElementById('q').addEventListener('input',function(){var v=this.value.trim().toLowerCase();clear();if(mode==='security')paintSecurity();if(!v)return;
nodes.forEach(function(n){var hit=(n.title+' '+n.path+' '+n.role).toLowerCase().indexOf(v)>=0;setCls(n.id,hit?'match':'dim');});});
setMode('structure');
})();
</script>
</body>
</html>
