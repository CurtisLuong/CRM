# Build APK RELEASE vỏ Android "Sổ Khách" (D-002) trên máy GitHub — thay cho android-app/build-apk.sh trên Mac.
# Chạy khi push nhánh có sửa android-app/** (vd. factory), hoặc bấm tay (Actions › Android APK › Run workflow).
# Khoá ký lấy từ GitHub Secrets — phải là ĐÚNG khoá đang ký app trên điện thoại, nếu không máy không cho cài đè
# (gỡ app cài lại = mất dữ liệu chưa đồng bộ trong máy).
#   ANDROID_KEYSTORE_BASE64  = base64 của android-app/sokhach-release.jks
#   ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD = các giá trị trong android-app/keystore.properties
# Kết quả: file APK ở mục Artifacts của lần chạy.
# Phát hành (chỉ nhánh main = production, Curtis đã duyệt): versionCode lớn hơn bản đang phát → tải APK lên
# Supabase Storage › app-releases rồi ghi app-releases/latest.json — app đọc file này để báo "Có bản app mới".
#   SUPABASE_SERVICE_ROLE_KEY = service role key Supabase PRODUCTION (chỉ nằm ở GitHub Secrets, không vào frontend)
#   Ghi chú bản mới: android-app/release-notes.txt
# latest.json: {versionCode, versionName, url, sha256, size, notes, publishedAt} — hợp đồng docs/ARCHITECTURE.md §7.
name: Android APK

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

# Hai lần chạy cùng nhánh không phát hành chồng nhau.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Gradle 8.14 chưa chạy được trên Java 25 → Java 21 như trên Mac.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Cài Capacitor + đồng bộ plugin
        working-directory: android-app
        run: |
          npm ci
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          npx cap sync android

      - name: Đặt khoá ký từ Secrets
        working-directory: android-app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Thiếu secret ANDROID_KEYSTORE_BASE64 — xem đầu file workflow."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > sokhach-release.jks
          {
            echo "storeFile=sokhach-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build APK release
        working-directory: android-app/android
        run: ./gradlew assembleRelease --console=plain

      - name: Đặt tên theo phiên bản
        id: name
        working-directory: android-app
        run: |
          VNAME=$(grep -E '^\s*versionName' android/app/build.gradle | grep -oE '"[^"]+"' | tr -d '"')
          cp android/app/build/outputs/apk/release/app-release.apk "SoKhach-$VNAME.apk"
          echo "file=SoKhach-$VNAME.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: android-app/${{ steps.name.outputs.file }}
          retention-days: 30

      - name: Phát hành lên Supabase (chỉ main)
        if: github.ref == 'refs/heads/main'
        working-directory: android-app
        env:
          SUPABASE_URL: https://nrqccwamwctihivpxjww.supabase.co
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FILE: ${{ steps.name.outputs.file }}
        run: |
          if [ -z "$SERVICE_KEY" ]; then
            echo "::error::Thiếu secret SUPABASE_SERVICE_ROLE_KEY — xem đầu file workflow."
            exit 1
          fi
          VCODE=$(grep -E '^\s*versionCode' android/app/build.gradle | grep -oE '[0-9]+')
          VNAME=$(grep -E '^\s*versionName' android/app/build.gradle | grep -oE '"[^"]+"' | tr -d '"')
          BASE="$SUPABASE_URL/storage/v1/object"
          PUBLISHED=$(curl -fsS "$BASE/public/app-releases/latest.json?t=$(date +%s)" 2>/dev/null | jq -r '.versionCode // 0' 2>/dev/null || echo 0)
          echo "Đang phát: versionCode $PUBLISHED · bản này: $VCODE ($VNAME)"
          if [ "$VCODE" -le "${PUBLISHED:-0}" ]; then
            echo "::notice::versionCode $VCODE không lớn hơn bản đang phát ($PUBLISHED) — không phát hành. Muốn phát bản mới: tăng versionCode/versionName trong android/app/build.gradle."
            exit 0
          fi
          # Không ghi đè APK cùng tên (x-upsert false): đã có file này nghĩa là có lỗi đánh số phiên bản.
          curl -fsS -X POST "$BASE/app-releases/$FILE" \
            -H "Authorization: Bearer $SERVICE_KEY" -H "apikey: $SERVICE_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" -H "x-upsert: false" -H "Cache-Control: max-age=31536000" \
            --data-binary "@$FILE"
          URL="$BASE/public/app-releases/$FILE"
          NOTES=$(cat release-notes.txt 2>/dev/null || true)
          jq -n --argjson code "$VCODE" --arg name "$VNAME" --arg url "$URL" \
            --arg sha "$(sha256sum "$FILE" | cut -d' ' -f1)" --argjson size "$(stat -c %s "$FILE")" \
            --arg notes "$NOTES" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{versionCode:$code, versionName:$name, url:$url, sha256:$sha, size:$size, notes:$notes, publishedAt:$at}' > latest.json
          cat latest.json
          # Bucket chỉ nhận kiểu APK/octet-stream (SQL/add_app_releases_bucket.sql) → latest.json gửi dạng octet-stream; fetch().json() vẫn đọc được.
          curl -fsS -X POST "$BASE/app-releases/latest.json" \
            -H "Authorization: Bearer $SERVICE_KEY" -H "apikey: $SERVICE_KEY" \
            -H "Content-Type: application/octet-stream" -H "x-upsert: true" -H "Cache-Control: max-age=60" \
            --data-binary @latest.json
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -I "$URL")
          [ "$CODE" = "200" ] || { echo "::error::APK đã tải lên nhưng link trả HTTP $CODE: $URL"; exit 1; }
          echo "::notice::Đã phát hành $VNAME (versionCode $VCODE): $URL"

      - name: Xoá khoá ký khỏi máy build
        if: always()
        working-directory: android-app
        run: rm -f sokhach-release.jks keystore.properties
