<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CRM Khách hàng — Bất động sản</title>
<meta name="theme-color" content="#1f3a3d" />
<link rel="manifest" href="/manifest.json" />
<link rel="stylesheet" href="/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<!-- ============ MÀN HÌNH ĐĂNG NHẬP ============ -->
<section id="auth-screen">
  <div class="auth-box">
    <h1>CRM Khách hàng</h1>
    <p class="auth-sub">Đăng nhập để xem &amp; đồng bộ danh sách khách của bạn</p>
    <form id="login-form">
      <label>Email
        <input type="email" id="auth-email" required autocomplete="username" />
      </label>
      <label>Mật khẩu
        <input type="password" id="auth-password" required autocomplete="current-password" />
      </label>
      <div id="auth-error" class="auth-error"></div>
      <button type="submit" class="btn-primary">Đăng nhập</button>
      <button type="button" id="signup-btn" class="btn-secondary">Tạo tài khoản mới</button>
    </form>
  </div>
</section>

<!-- ============ MÀN HÌNH CHÍNH ============ -->
<section id="app-screen" hidden>
  <header class="topbar">
    <h1>Khách hàng</h1>
    <div class="topbar-right">
      <span id="sync-badge" class="sync-badge">…</span>
      <button id="logout-btn" class="btn-ghost">Đăng xuất</button>
    </div>
  </header>

  <div class="toolbar">
    <input id="search-input" type="search" placeholder="Tìm theo SĐT hoặc tên..." />
    <select id="filter-stage"></select>
    <select id="filter-evaluation">
      <option value="">— Đánh giá: tất cả —</option>
      <option value="nên chăm">Nên chăm</option>
      <option value="không nên chăm">Không nên chăm</option>
    </select>
    <label class="filter-interest-label">
      Q.tâm ≥
      <input id="filter-min-interest" type="number" min="0" max="100" value="0" />%
    </label>
    <select id="sort-select">
      <option value="updated_desc">Mới cập nhật</option>
      <option value="interest_desc">Mức quan tâm cao nhất</option>
      <option value="name_asc">Tên A→Z</option>
    </select>
    <button id="clear-filters-btn" class="btn-ghost">Xoá lọc</button>
    <button id="add-customer-btn" class="btn-primary">+ Thêm khách</button>
  </div>

  <div class="list-meta">
    <span id="result-count"></span>
  </div>

  <div id="customer-list" class="customer-list"></div>
  <div id="empty-state" class="empty-state" hidden>
    Chưa có khách nào khớp bộ lọc. Bấm <strong>+ Thêm khách</strong> để bắt đầu.
  </div>
</section>

<!-- ============ FORM THÊM / SỬA KHÁCH (modal) ============ -->
<dialog id="form-modal">
  <form id="customer-form">
    <h2 id="form-title">Thêm khách mới</h2>

    <div class="form-grid">
      <label>Số điện thoại *
        <input name="phone" type="tel" required placeholder="09xxxxxxxx" />
      </label>
      <label>Họ tên *
        <input name="full_name" type="text" required />
      </label>
      <label>Giới tính
        <select name="gender">
          <option value="">— Chưa rõ —</option>
          <option value="nam">Nam</option>
          <option value="nữ">Nữ</option>
          <option value="khác">Khác</option>
        </select>
      </label>
      <label>Ngày sinh (dương lịch)
        <input name="dob" type="date" />
      </label>
      <label class="span-2">Mệnh (tự tính từ ngày sinh)
        <div id="menh-preview" class="menh-preview">— nhập ngày sinh để tính mệnh —</div>
      </label>
      <label>Trạng thái hôn nhân
        <select name="marital_status">
          <option value="">— Chưa rõ —</option>
          <option value="đã kết hôn">Đã kết hôn</option>
          <option value="chưa kết hôn">Chưa kết hôn</option>
        </select>
      </label>
      <label>Thu nhập
        <input name="income" type="text" placeholder="vd: ~25tr/tháng" />
      </label>
      <label class="span-2">Thường trú
        <input name="residence" type="text" />
      </label>

      <fieldset class="span-2">
        <legend>Căn hộ quan tâm</legend>
        <div class="form-grid">
          <label>Loại căn
            <input name="apt_type" type="text" placeholder="vd: 2N-2WC" />
          </label>
          <label>Mã căn
            <input name="apt_code" type="text" />
          </label>
          <label>Mã toà
            <input name="building_code" type="text" />
          </label>
          <label>Giá căn (VNĐ)
            <input name="apt_price" type="number" min="0" step="1000000" />
          </label>
        </div>
      </fieldset>

      <label class="span-2">Chi tiết (freeform)
        <textarea name="notes" rows="4" placeholder="Mua cho con, đang vướng nợ xấu, muốn vay ngân hàng, đang so sánh giá..."></textarea>
      </label>

      <label class="span-2">Mức độ quan tâm: <span id="interest-output">50%</span>
        <input name="interest_level" type="range" min="0" max="100" value="50" />
      </label>

      <label>Tiến độ chăm sóc
        <select name="care_stage"></select>
      </label>
      <label>Đánh giá
        <select name="evaluation">
          <option value="">— Chưa đánh giá —</option>
          <option value="nên chăm">Nên chăm</option>
          <option value="không nên chăm">Không nên chăm</option>
        </select>
      </label>
      <label class="span-2" id="evaluation-reason-wrap" hidden>
        Lý do không nên chăm
        <input name="evaluation_reason" type="text" list="eval-reason-datalist" placeholder="Chọn hoặc gõ lý do khác" />
        <datalist id="eval-reason-datalist"></datalist>
      </label>
    </div>

    <div class="form-actions">
      <button type="button" id="cancel-form-btn" class="btn-ghost">Huỷ</button>
      <button type="submit" class="btn-primary">Lưu</button>
    </div>
  </form>
</dialog>

<script src="/js/config.js"></script>
<script src="/js/lunar.js"></script>
<script src="/js/db.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
