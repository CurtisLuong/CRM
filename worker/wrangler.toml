# Cấu hình deploy cho intake-worker (Cloudflare Worker).
# Deploy: cd worker && wrangler deploy
# Các secret (GEMINI_API_KEY, SUPABASE_URL, SUPABASE_ANON_KEY, ALLOWED_ORIGIN, và nhóm FB_* +
# SUPABASE_SERVICE_ROLE_KEY cho Facebook Lead Ads — xem README)
# đặt bằng `wrangler secret put <TÊN>` — KHÔNG ghi vào file này.

name = "intake-worker"
main = "intake-worker.js"
compatibility_date = "2025-01-01"

# WORKERS AI (route POST /ai — ai-assist.js): binding tên AI, không cần API key, tính vào gói
# Workers AI của tài khoản Cloudflare (miễn phí 10.000 neurons/ngày).
[ai]
binding = "AI"

# GHIM VỊ TRÍ CHẠY Worker (Placement Hints). Mặc định Worker chạy ở trạm Cloudflare GẦN NGƯỜI DÙNG
# nhất — một số mạng (vd FPT) đi qua trạm Hồng Kông, nơi Gemini API KHÔNG hỗ trợ → lỗi
# "User location is not supported for the API use". Ghim về Mỹ (gần máy chủ Google) để mọi mạng
# đều gọi Gemini từ cùng 1 vùng được hỗ trợ. Đổi vùng: xem developers.cloudflare.com/workers/configuration/placement/
[placement]
region = "gcp:us-east4"

# Quét lead Facebook mới mỗi 5 phút (fb-leads.js pollLeads) — chạy được cả khi app Meta chưa Live.
# Chưa đặt FB_PAGE_ID / FB_PAGE_ACCESS_TOKEN thì lượt quét tự bỏ qua.
[triggers]
# Lãi vay mua nhà: 00:00 UTC = 07:00 Việt Nam; tách khỏi lượt Facebook.
crons = ["*/5 * * * *", "0 0 * * *", "*/10 * * * *"]

# Trạng thái Worker lãi suất giữa các lượt (trang đã đọc, hàng chờ, nghỉ khi hết hạn mức AI) — BR-09.
# Thiếu binding thì Worker lãi suất chạy kiểu cũ. Namespace tạo 14/11/2026.
[[kv_namespaces]]
binding = "BANK_RATES_STATE"
id = "611546a7bc954aa2bc2f2ef7bc4af805"
